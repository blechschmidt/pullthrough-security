name: CI

# Build, test, lint, and publish container images.
# - PRs and branch pushes: run tests/lint, the ecosystem suites (hermetic, and
#   with each ecosystem's real package manager pulling through the proxy), and a
#   no-push image build (validates the Dockerfile without publishing).
# - Pushes to main and version tags (v*): additionally publish multi-arch images
#   to GHCR with provenance + SBOM attestations.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Nightly extended fuzzing of the untrusted-input parsers (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-target fuzz duration (e.g. 5m)"
        required: false
        default: "5m"

permissions:
  contents: read

env:
  GO_VERSION: "1.24.1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A newer push to a ref cancels the older run of that ref. The nightly fuzzing
# (event "schedule") has a group of its own: a push to main must not cancel it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------- #
  # Test & static analysis across a CPU-architecture matrix. The amd64 leg runs
  # on the standard x86-64 hosted runner; the arm64 leg runs on GitHub's native
  # aarch64 hosted runner (`ubuntu-24.04-arm`) so `go test ./...` (and the FIPS
  # variant, see the `fips` job) are exercised on both architectures the project
  # ships binaries and container images for. If native arm64 runners are not
  # available to a fork, swap the arm64 leg's `runs-on` for `ubuntu-latest` and
  # run the suite under QEMU emulation (see docs/platforms.md) — the code is
  # pure-Go (CGO_ENABLED=0) and has no architecture-specific paths.
  #
  # Architecture-independent gates (gofmt, go vet, go mod tidy, config-reference
  # staleness) run once, on the amd64 leg only; the compile-and-run gates
  # (race-enabled test suite, fuzz seed-corpus regression) run on every leg to
  # catch arch-specific miscompiles or endianness/word-size assumptions.
  test:
    name: Test & static analysis (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        if: matrix.arch == 'amd64'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        if: matrix.arch == 'amd64'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        if: matrix.arch == 'amd64'
        run: go vet ./...

      # The configuration reference is generated from the config struct tags and
      # defaults; fail if the committed docs no longer match the code (mirrors the
      # observability-gen staleness convention).
      - name: Check config reference is up to date
        if: matrix.arch == 'amd64'
        run: make config-reference-check

      # The admission-gate reference is generated from the in-code gate catalog
      # (internal/gatedoc) and the findings rule catalog; fail if the committed
      # docs no longer match the code so new gates stay documented.
      - name: Check gate reference is up to date
        if: matrix.arch == 'amd64'
        run: make gate-reference-check

      # The ecosystem test reference is generated from the real-package-manager
      # test catalog and its client scripts (internal/ecotest) — the very client
      # configurations the `ecosystem` jobs execute; fail if the committed docs no
      # longer match what is tested.
      - name: Check ecosystem test reference is up to date
        if: matrix.arch == 'amd64'
        run: make ecosystem-reference-check

      # The LLM-scan coverage table is generated from a catalog
      # (internal/scancoverage) that the test suite checks against the real
      # backends: which request paths of every upstream type carry installable
      # content, in which format, over which serve path. Fail if the committed
      # document no longer matches the catalog.
      - name: Check LLM scan coverage table is up to date
        if: matrix.arch == 'amd64'
        run: make llmscan-coverage-check

      # The lock-file format tables of docs/lockfiles.md are generated from the
      # scanner's own tables (internal/lockfiles), which tests hold to the
      # golden fixtures: what each format records, its digests and its limits.
      - name: Check lock-file reference is up to date
        if: matrix.arch == 'amd64'
        run: make lockfile-reference-check

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage-${{ matrix.arch }}.out ./...

      # Replay every fuzz seed corpus (real + known-malformed samples, plus any
      # regression inputs found by past fuzzing) as fast, deterministic tests.
      # This catches re-introduced crashers on every PR without time-boxed
      # fuzzing. Extended fuzzing runs in the scheduled `fuzz` job below.
      - name: Fuzz seed corpora (regression)
        run: go test -tags fuzz ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.arch }}
          path: coverage-${{ matrix.arch }}.out
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- #
  # Supply-chain attack red-team / gate-efficacy suite (Task 76). Injects a
  # curated catalog of synthetic attacks end-to-end through the full admission
  # pipeline and fails if any scenario regresses from "blocked" to "admitted" —
  # i.e. a defense silently stopped working. Emits the coverage matrix as a
  # Markdown artifact and into the job summary.
  redteam:
    name: Red-team gate-efficacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The Go test below is the authoritative regression gate (fails the job on
      # any scenario regression). Run it under the race detector like the main
      # suite.
      - name: Run red-team suite (regression gate)
        run: go test -race ./internal/redteam/...

      # Build the client and emit the human-readable coverage matrix for the run
      # summary and as a downloadable artifact. `ptctl redteam` exits non-zero on
      # failure, reinforcing the gate above.
      - name: Render coverage matrix
        if: always()
        run: |
          go run ./cmd/ptctl redteam --format markdown --output redteam-report.md
          cat redteam-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: redteam-report.md
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- #
  # FIPS 140-3 build variant (Task 120). Compiles the proxy and client with the
  # Go FIPS 140-3 Cryptographic Module (GOFIPS140) and the `fips` build tag, then
  # runs the suite with the module activated (GODEBUG=fips140=on) so the FIPS
  # variant is exercised on every PR and cannot silently break.
  fips:
    name: FIPS 140-3 variant build & test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build FIPS variant
        run: make build-fips

      - name: Confirm the binary reports the FIPS crypto mode
        run: |
          # The built binary's build info must record the GOFIPS140 selector; the
          # `fips.enabled` + validate step above is covered by the test run below.
          go version -m bin/pullthrough-fips | grep -E 'GOFIPS140=' \
            || { echo "built binary is not a FIPS variant (no GOFIPS140 build setting)"; exit 1; }

      - name: Test under the FIPS module (GODEBUG=fips140=on)
        run: make test-fips

  # ----------------------------------------------------------------------- #
  # Mutation / test-quality gate (Task 157). Measures the fault-detection
  # strength of the unit suite for the highest-risk admission-gate packages by
  # seeding behavior-changing mutants and re-running their tests, then fails if
  # the mutation score regresses beyond the threshold versus the committed
  # per-package baseline (mutation/mutation-baseline.json) or a critical package
  # falls under its floor — mirroring the coverage-regression gate. The run is
  # seeded (MUT_SEED) and sampled (MUT_MAX_PER_PACKAGE) so it is deterministic.
  # It is its own job because a full run takes several minutes; it does not block
  # the fast unit suite. Lower the cap / narrow the packages here if CI time is
  # tight (see docs/mutation-testing.md).
  mutation:
    name: Mutation / test-quality gate
    runs-on: ubuntu-latest
    # Guard against a hung run; a full seeded run is several minutes but well
    # under this ceiling (the job is skipped from the fast path's critical gate).
    # The harness itself bounds each mutant's compile, test-timeout, and resident
    # memory (internal/muttest) so a runaway-allocation mutant is killed as its
    # own process rather than OOM-reclaiming the whole runner mid-run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Mutation-score regression gate
        run: make mutation

      - name: Publish mutation summary
        if: always()
        run: |
          if [ -f mutation/mutation-summary.md ]; then
            cat mutation/mutation-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutation/mutation-report.json
            mutation/mutation-summary.md
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- #
  # Self-release reproducibility guard (Task 135). Proves the proxy's own release
  # build is bit-for-bit reproducible (built twice, digests compared) on every PR
  # so the self-releasing signed-artifact pipeline (.github/workflows/release.yml)
  # cannot silently regress. Also runs the verify-self verification unit tests.
  self-release:
    name: Reproducible self-release guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Prove reproducibility for both shipped Linux architectures. These are
      # pure-Go cross-compiles from the x86-64 runner (CGO_ENABLED=0), so the
      # arm64 artifacts are produced and digest-compared here without an arm64
      # host — the same determinism guarantee the release workflow relies on when
      # it assembles per-arch binaries and the multi-arch image.
      - name: Reproducible build (standard, linux/amd64 + linux/arm64)
        env:
          GOTOOLCHAIN: local
        run: scripts/release-repro-check.sh standard "ci-$(git rev-parse --short HEAD)" linux/amd64 linux/arm64

      - name: Reproducible build (FIPS, linux/amd64 + linux/arm64)
        env:
          GOTOOLCHAIN: local
        run: scripts/release-repro-check.sh fips "ci-$(git rev-parse --short HEAD)" linux/amd64 linux/arm64

      - name: verify-self verification tests
        run: go test ./internal/selfrelease/...

  # ----------------------------------------------------------------------- #
  # Ecosystem integration suites, hermetic (Tasks 144 + 168). For every
  # supported ecosystem these drive an in-process gateway over a recorded
  # upstream: the whole-pipeline suite (routing, cache, digest verification,
  # gates, SARIF, dossier) and the LLM commit-scan admission suite (a mock LLM
  # scans a package's source commit; a benign commit admits the package, a
  # malicious one blocks it). They need no network and no client tooling, so they
  # are deterministic and gate the image build. They live behind the
  # `integration` build tag, which the `test` job does not set.
  #
  # The download-log suite (Task 176, internal/e2e/downloadlog) runs here too. It
  # is hermetic as well — stub registries on loopback — but its clients are real:
  # the real `cargo` and the real `go` command fetch packages through the real
  # proxy binary, every client machine from its own source address, and the suite
  # asserts through the admin API which package the log attributes to which
  # address (served, served from cache, refused, forwarded by a trusted proxy,
  # forged). PT_DOWNLOADLOG_CLIENTS=real makes a missing package manager a
  # failure rather than a silent fall-back to the scripted stand-in.
  #
  # So does the personal-links suite (Task 177, internal/e2e/userlinks): two
  # users sign in at an OpenID Connect identity provider, each gets a personal
  # cache link, and the real `npm`, `pip`, `cargo` and `go` — configured with the
  # snippet the links page hands out — install a package through it. The suite
  # asserts that the download log tells the users apart although every client
  # runs on the same machine, that revoking a link stops it (on a second replica
  # too), and that no link's token is in anything the proxy wrote or sent
  # upstream. PT_USERLINKS_CLIENTS=real makes a missing package manager a
  # failure instead of a skipped row.
  integration:
    name: Ecosystem integration suites (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The download-log suite drives the real package managers of the Rust and
      # Go ecosystems, the personal-links suite those of npm and PyPI as well.
      # Rust, Node.js and Python ship with the hosted runner image; fail here,
      # with a clear message, if that ever changes.
      - name: Show the package managers the download-log and personal-links suites drive
        run: |
          cargo --version
          go version
          echo "npm $(npm --version)"
          python3 -m pip --version

      # Every suite under internal/e2e but the LLM package-scan suite, which has
      # a job of its own (llm-package-scan, below).
      - name: Run the per-ecosystem pipeline, LLM-scan admission, download-log and personal-links suites
        env:
          PT_TEST_REPORT_DIR: ${{ runner.temp }}/integration-report
          PT_DOWNLOADLOG_CLIENTS: real
          PT_USERLINKS_CLIENTS: real
        run: go test -race -tags integration $(go list -tags integration ./internal/e2e/... | grep -v '/internal/e2e/pkgscan$')

      - name: Publish matrices
        if: always()
        run: |
          for f in e2e-coverage-matrix.md llm-scan-matrix.md download-log-matrix.md user-links-matrix.md; do
            if [ -f "$RUNNER_TEMP/integration-report/$f" ]; then
              cat "$RUNNER_TEMP/integration-report/$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload matrices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: ${{ runner.temp }}/integration-report
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- #
  # LLM package-content scan, every ecosystem end to end (Task 175,
  # internal/e2e/pkgscan). For every upstream type the configuration accepts, the
  # real `pullthrough` binary — started from a configuration file with
  # llmPackageScan enabled — pulls packages in that ecosystem's own format (a
  # wheel, a crate, a .deb, an .rpm, an OCI image, a NAR, a Helm chart, a model
  # file, …) from a stub registry speaking its protocol, while a mock LLM
  # endpoint speaking the Anthropic and OpenAI wire formats stands in for the
  # model. Per ecosystem: a benign package is served and the model was shown the
  # marker file from inside it; a flagged one is refused (403,
  # X-Policy-Code: llm-package-malicious), quarantined, recorded as a finding and
  # in the audit log, and refused again — from the stored verdict — on a retry,
  # after a restart and from the cache; a second pull costs no LLM call;
  # failMode closed refuses and failMode open serves (annotated) on a provider
  # error and on a timeout; a prompt injection inside the package does not turn
  # the verdict. Git: LFS objects go through the same scenarios, and the LLM
  # commit scan still refuses the package built from a flagged commit.
  #
  # Hermetic: stubs and the mock LLM listen on loopback, the proxy's egress guard
  # allows nothing else, and no LLM API is called. The suite fails when any
  # upstream type has no fully passing row, so a backend added later cannot stay
  # outside it. The ecosystem × scenario matrix is published to the job summary
  # and uploaded as the `llm-package-scan-matrix` artifact.
  llm-package-scan:
    name: LLM package-scan suite, every ecosystem (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The Git rows drive the real git (and `git http-backend` as the stub
      # server); it ships with the hosted runner image.
      - name: Show the git the suite drives
        run: git --version

      - name: Build the proxy under test
        run: go build -o "$RUNNER_TEMP/pullthrough" ./cmd/pullthrough

      - name: Run the LLM package-scan suite
        env:
          PT_PKGSCAN_PROXY_BIN: ${{ runner.temp }}/pullthrough
          PT_TEST_REPORT_DIR: ${{ runner.temp }}/llm-package-scan-report
        run: go test -race -tags integration -count=1 -v ./internal/e2e/pkgscan/

      - name: Publish the matrix
        if: always()
        run: |
          f="$RUNNER_TEMP/llm-package-scan-report/llm-package-scan-matrix.md"
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The suite wrote no matrix: it stopped before the ecosystems ran." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-package-scan-matrix
          path: ${{ runner.temp }}/llm-package-scan-report
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- #
  # Ecosystem tests with REAL package managers (Task 170).
  #
  # Every other suite speaks HTTP to the proxy the way its author read each
  # protocol's specification. These jobs instead run each ecosystem's real
  # client — npm, pip, cargo, go, dotnet, mvn, the Docker Engine, helm, bundler,
  # composer, terraform, conan, conda, apt-get, dnf, git, mix, bazel, julia,
  # cpanm, R, dart pub, ovsx, nix, deno, cabal, brew, ansible-galaxy, r10k,
  # huggingface_hub, SwiftPM, and apk through a generic upstream — configured to
  # use the pull-through proxy instead of the public registry, against the real
  # proxy binary fronting the real upstream. Per ecosystem they assert:
  #
  #   1. the client installs a package through the proxy, the artifact lands in
  #      the proxy's cache, and its admission was decided by the LLM scan of the
  #      source commit it is pinned to (benign);
  #   2. a second install from a pristine client is served from the cache;
  #   3. a package whose source commit the LLM flagged malicious is refused, and
  #      the real client fails (where the backend reports a package coordinate:
  #      not for Git or a generic upstream);
  #   4. for cargo and go: the proxy's download log attributes the installed
  #      package to the address of each client run that installed it, and the
  #      refused one — as blocked — to the run that tried (Task 176). Every
  #      client run reaches the proxy from an address of its own;
  #   5. the same install and refusal with the client NOT pointed at the proxy
  #      (Task 172): through TLS interception (only HTTPS_PROXY and the proxy's
  #      CA), and in NAT mode (only the CA; the registry's hostnames resolve to
  #      the proxy's NAT listeners and nothing else is reachable).
  #
  # The LLM is a mock speaking the provider's wire format; everything else is
  # real. Client containers run with no network at all (the proxy is reachable
  # through a loopback forwarder only), so an install that succeeds provably took
  # nothing from anywhere but the proxy. See docs/ecosystem-tests.md.
  #
  # Layout: one build job compiles the proxy and the (static) test binary once
  # and derives the job matrix from the test catalog; one job per ecosystem runs
  # the test; a final job assembles the matrix and fails unless every ecosystem
  # ran and passed. The legs need only Docker — no Go toolchain, no sources.
  #
  # These jobs depend on the public registries being up, so they do not gate the
  # image build (a registry outage must not block a release); they do turn the
  # workflow red, and they also run on the nightly schedule as a canary for
  # upstream protocol or client changes.
  ecosystem-build:
    name: Ecosystem tests · build
    runs-on: ubuntu-latest
    outputs:
      ecosystems: ${{ steps.list.outputs.ecosystems }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Static binaries: the test binary is re-executed inside every client
      # image (glibc and musl alike) as the loopback forwarder.
      - name: Build the proxy and the ecosystem test binary
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ecotest-bin
          go build -o ecotest-bin/pullthrough ./cmd/pullthrough
          go test -c -tags ecosystem -o ecotest-bin/ecotest.test ./internal/ecotest

      # The matrix comes from the test catalog itself, so adding an ecosystem to
      # the catalog adds its CI leg without touching this workflow.
      - name: Derive the ecosystem matrix from the test catalog
        id: list
        run: |
          ecosystems="$(ECOTEST_LIST=1 ecotest-bin/ecotest.test)"
          echo "ecosystems=${ecosystems}" >> "$GITHUB_OUTPUT"
          echo "Ecosystems: ${ecosystems}"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ecotest-bin
          path: ecotest-bin
          retention-days: 1

  ecosystem:
    name: Ecosystem · ${{ matrix.ecosystem }}
    needs: ecosystem-build
    runs-on: ubuntu-latest
    # Three legs per ecosystem: explicit, TLS interception and NAT (Task 172).
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        ecosystem: ${{ fromJSON(needs.ecosystem-build.outputs.ecosystems) }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ecotest-bin
          path: ecotest-bin

      - name: Run the real ${{ matrix.ecosystem }} client through the proxy
        env:
          ECOTEST_ECOSYSTEMS: ${{ matrix.ecosystem }}
          ECOTEST_WORKDIR: ${{ runner.temp }}/ecotest
          ECOTEST_REPORT_DIR: ${{ runner.temp }}/ecotest-report
        run: |
          chmod +x ecotest-bin/pullthrough ecotest-bin/ecotest.test
          export ECOTEST_BIN="$PWD/ecotest-bin/pullthrough"
          ecotest-bin/ecotest.test -test.run '^TestEcosystems$' -test.v -test.timeout 75m

      - name: Publish result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ecotest-report/ecosystem-matrix.md" ]; then
            cat "$RUNNER_TEMP/ecotest-report/ecosystem-matrix.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The per-ecosystem result row; the matrix job assembles them.
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-result-${{ matrix.ecosystem }}
          path: ${{ runner.temp }}/ecotest-report/${{ matrix.ecosystem }}.json
          if-no-files-found: warn

      # Proxy log, proxy config and client output, to diagnose a failure without
      # re-running it. (The client scratch directories are not uploaded: they are
      # written by the container's user and hold only installed packages.)
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-logs-${{ matrix.ecosystem }}
          path: |
            ${{ runner.temp }}/ecotest/${{ matrix.ecosystem }}/logs
            ${{ runner.temp }}/ecotest/${{ matrix.ecosystem }}/proxy/config.yaml
          if-no-files-found: ignore

  ecosystem-matrix:
    name: Ecosystem tests · matrix
    needs: [ecosystem-build, ecosystem]
    # Run even when legs failed: a red matrix is exactly when it is needed.
    if: always() && needs.ecosystem-build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ecotest-bin
          path: ecotest-bin

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: ecosystem-result-*
          path: ecotest-results

      # Fails unless EVERY catalog ecosystem produced a result and passed, so a
      # leg that never started (or was cancelled) cannot go unnoticed.
      - name: Assemble the ecosystem matrix
        env:
          ECOTEST_AGGREGATE: "1"
          ECOTEST_REPORT_DIR: ecotest-results
        run: |
          chmod +x ecotest-bin/ecotest.test
          mkdir -p ecotest-results
          ecotest-bin/ecotest.test -test.run '^TestEcosystemMatrix$' -test.v

      - name: Upload matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-matrix
          path: |
            ecotest-results/ecosystem-matrix.md
            ecotest-results/ecosystem-matrix.json
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- #
  # Extended fuzzing of the protocol/manifest parsers. Runs only on the nightly
  # schedule or manual dispatch (never on PRs, which use the fast seed-corpus
  # regression above). A discovered crasher is written under testdata/fuzz and
  # uploaded so it can be committed as a permanent regression seed.
  #
  # The targets run in nine parallel shards (make fuzz FUZZ_SHARDS/FUZZ_SHARD):
  # some 110 targets at 5 minutes each take over nine hours one after another,
  # and a hosted job is stopped at six. A shard is about an hour.
  fuzz:
    name: Extended fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run fuzz targets
        run: make fuzz FUZZTIME=${{ github.event.inputs.fuzztime || '5m' }} FUZZ_SHARDS=9 FUZZ_SHARD=${{ matrix.shard }}

      - name: Upload discovered crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers-${{ matrix.shard }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- #
  lint-manifests:
    name: Lint Helm chart & manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      - name: helm lint
        run: helm lint deploy/helm/pullthrough --values deploy/helm/pullthrough/ci/ct-values.yaml

      - name: helm template (render check)
        run: helm template pullthrough deploy/helm/pullthrough --values deploy/helm/pullthrough/ci/ct-values.yaml > /dev/null

      - name: Validate raw manifests render with kustomize
        run: kubectl kustomize deploy/k8s > /dev/null

      - name: Validate observability bundle (dashboards/alerts vs code)
        run: |
          pip install --quiet pyyaml
          python3 deploy/observability/validate.py

      - name: Validate observability manifests render with kustomize
        run: kubectl kustomize deploy/observability > /dev/null

  # ----------------------------------------------------------------------- #
  build-image:
    name: Build & publish image
    # Skip on the nightly fuzz schedule / manual fuzz dispatch: those events run
    # only the extended-fuzzing job, not the image publish pipeline.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test, redteam, integration, llm-package-scan, lint-manifests]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only authenticate when we intend to push (not on PRs from forks).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Per-platform provenance + SBOM referenced from the multi-arch index.
          provenance: mode=max
          sbom: true

      - name: Generate build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
