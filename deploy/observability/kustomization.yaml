# Observability bundle for the plain-manifest / kustomize deploy path.
#
#   kubectl apply -k deploy/observability
#
# Ships:
#   * a PrometheusRule with all alerting rules (requires the Prometheus Operator CRDs), and
#   * one ConfigMap per Grafana dashboard, each labelled `grafana_dashboard=1` so the
#     Grafana sidecar (kube-prometheus-stack) imports it automatically.
#
# This is intentionally separate from deploy/k8s so clusters without the
# Prometheus Operator / Grafana sidecar can deploy the proxy without these CRDs.
# Adjust the namespace and the operator ruleSelector label to match your cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pullthrough

resources:
  - prometheusrule.yaml

# Generate a ConfigMap per dashboard from the canonical JSON. The generator's
# name suffix hash makes updates roll out as new immutable ConfigMaps.
configMapGenerator:
  - name: pullthrough-dashboard-cache-performance
    files:
      - grafana/dashboards/cache-performance.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Pull-through
  - name: pullthrough-dashboard-supply-chain-security
    files:
      - grafana/dashboards/supply-chain-security.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Pull-through
  - name: pullthrough-dashboard-upstream-latency-errors
    files:
      - grafana/dashboards/upstream-latency-errors.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Pull-through
  - name: pullthrough-dashboard-per-tenant-traffic
    files:
      - grafana/dashboards/per-tenant-traffic.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Pull-through

commonLabels:
  app.kubernetes.io/name: pullthrough
  app.kubernetes.io/part-of: pullthrough
