# Example Secret. DO NOT commit real secrets — in production populate this via a
# sealed-secret, External Secrets Operator, or `kubectl create secret generic`.
# The config references these via ${VAR} expansion; they are injected as env vars.
#
#   kubectl create secret generic pullthrough-secrets -n pullthrough \
#     --from-literal=PTS_AUDIT_HMAC_KEY="$(openssl rand -hex 32)" \
#     --from-literal=GITHUB_TOKEN="ghp_..." \
#     --from-literal=ANTHROPIC_API_KEY="sk-ant-..."
apiVersion: v1
kind: Secret
metadata:
  name: pullthrough-secrets
  namespace: pullthrough
  labels:
    app.kubernetes.io/name: pullthrough
type: Opaque
stringData:
  PTS_AUDIT_HMAC_KEY: "change-me-32-byte-hex-or-base64"
  PTS_SECRETS_KEY: ""
  GITHUB_TOKEN: ""
  ANTHROPIC_API_KEY: ""
  PTS_ADMIN_TOKEN: ""
