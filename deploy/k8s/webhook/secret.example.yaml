# EXAMPLE secrets for the admission webhook. Do NOT commit real material; create
# these out-of-band (sealed-secrets, External Secrets Operator, or cert-manager).
#
# 1) Serving certificate the API server connects to. The CA that issued tls.crt
#    must be referenced as the ValidatingWebhookConfiguration's caBundle (see the
#    TLS bootstrap guidance in docs/admission-webhook.md). With cert-manager, a
#    Certificate resource populates this Secret automatically and the
#    `cert-manager.io/inject-ca-from` annotation fills the caBundle.
#
#    The serving cert MUST carry the Service DNS name as a SAN:
#      pullthrough-webhook.pullthrough.svc
#
#    Manual bootstrap:
#      kubectl -n pullthrough create secret tls pullthrough-webhook-tls \
#        --cert=tls.crt --key=tls.key
apiVersion: v1
kind: Secret
metadata:
  name: pullthrough-webhook-tls
  namespace: pullthrough
  labels:
    app.kubernetes.io/name: pullthrough-webhook
    app.kubernetes.io/part-of: pullthrough
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_SERVING_CERT
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_SERVING_KEY
    -----END PRIVATE KEY-----
---
# 2) Environment secrets for the webhook workload. PTS_ADMIN_TOKEN is the bearer
#    token the webhook presents to the proxy's admin dossier API (it must have at
#    least the read capability). Referenced from the config as ${PTS_ADMIN_TOKEN}.
#      kubectl -n pullthrough create secret generic pullthrough-webhook-secrets \
#        --from-literal=PTS_ADMIN_TOKEN=<token>
apiVersion: v1
kind: Secret
metadata:
  name: pullthrough-webhook-secrets
  namespace: pullthrough
  labels:
    app.kubernetes.io/name: pullthrough-webhook
    app.kubernetes.io/part-of: pullthrough
type: Opaque
stringData:
  PTS_ADMIN_TOKEN: "REPLACE_WITH_ADMIN_READ_TOKEN"
