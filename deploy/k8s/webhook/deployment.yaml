apiVersion: apps/v1
kind: Deployment
metadata:
  name: pullthrough-webhook
  namespace: pullthrough
  labels:
    app.kubernetes.io/name: pullthrough-webhook
    app.kubernetes.io/part-of: pullthrough
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pullthrough-webhook
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pullthrough-webhook
    spec:
      serviceAccountName: pullthrough-webhook
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: ghcr.io/blechschmidt/pullthrough-security:latest
          imagePullPolicy: IfNotPresent
          # The standalone webhook subcommand serves only the admission endpoint,
          # reading verdicts from the proxy's admin dossier API.
          args: ["webhook", "-config", "/etc/pullthrough/webhook.yaml"]
          ports:
            - name: https
              containerPort: 8443
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: pullthrough-webhook-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/pullthrough
              readOnly: true
            - name: tls
              mountPath: /etc/pullthrough/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: pullthrough-webhook-config
        - name: tls
          secret:
            secretName: pullthrough-webhook-tls
        - name: tmp
          emptyDir: {}
