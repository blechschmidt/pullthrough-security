# Optional: shared S3-compatible cache backend for a horizontally-scaled (HA)
# deployment. With it, every replica shares one cache in an object-storage bucket
# instead of each keeping its own copy on a per-pod ReadWriteOnce PVC. This lets
# you scale `deployment.yaml`/`hpa.yaml` freely and drop the cache PVC entirely.
#
# Apply alongside the base manifests, then:
#   1. Patch the `cache:` block of configmap.yaml to the `cache:` shown below
#      (backend: s3 + the s3: stanza).
#   2. Provide the credentials. The base deployment.yaml loads `pullthrough-secrets`
#      via envFrom, so the simplest path is to add the two PTS_CACHE_S3_* keys to
#      that Secret. The standalone Secret below is an alternative — if you use it,
#      add a second `envFrom: secretRef: { name: pullthrough-cache-s3 }` entry to
#      deployment.yaml.
#   3. Optionally remove pvc.yaml and the cache volume mount from deployment.yaml
#      (object storage is now the durable cache); keep a small emptyDir for the
#      S3 upload spool directory if you set cache.s3.spoolDir.
#   4. kubectl apply -f deploy/k8s/ -f deploy/k8s/shared-cache.example.yaml
#
# The bucket must exist beforehand. Manage cache retention with an object-store
# lifecycle/expiration policy rather than per-replica LRU eviction (keep
# maxSizeBytes: 0).
---
apiVersion: v1
kind: Secret
metadata:
  name: pullthrough-cache-s3
  namespace: pullthrough
  labels:
    app.kubernetes.io/name: pullthrough
type: Opaque
stringData:
  # For AWS, prefer IRSA/STS over static keys where possible; the proxy also
  # accepts a session token via cache.s3.sessionToken.
  PTS_CACHE_S3_ACCESS_KEY_ID: "AKIAEXAMPLE"
  PTS_CACHE_S3_SECRET_ACCESS_KEY: "change-me"
---
# Drop-in replacement for the `cache:` section of configmap.yaml. Shown as its own
# ConfigMap purely for reference/diffing; in practice edit the inline config in
# configmap.yaml so the whole document stays a single source of truth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pullthrough-config-s3-cache-snippet
  namespace: pullthrough
  labels:
    app.kubernetes.io/name: pullthrough
data:
  cache.snippet.yaml: |
    cache:
      backend: s3
      maxSizeBytes: 0          # retention via bucket lifecycle policy, not LRU
      ttl: 168h
      s3:
        endpoint: https://s3.us-east-1.amazonaws.com   # or http://minio.minio.svc:9000
        region: us-east-1
        bucket: my-org-pullthrough-cache
        prefix: cache/
        usePathStyle: false                            # set true for MinIO/Ceph
        accessKeyId: ${PTS_CACHE_S3_ACCESS_KEY_ID}
        secretAccessKey: ${PTS_CACHE_S3_SECRET_ACCESS_KEY}
        # sharedMode defaults to true: a replica serves content another replica
        # wrote after it started. Leave it on for HA.
