apiVersion: apps/v1
kind: Deployment
metadata:
  name: pullthrough
  namespace: pullthrough
  labels:
    app.kubernetes.io/name: pullthrough
spec:
  # Managed by the HPA; the replicas field is omitted intentionally so the HPA
  # is authoritative. Set replicas here only if you remove the HPA.
  selector:
    matchLabels:
      app.kubernetes.io/name: pullthrough
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pullthrough
    spec:
      serviceAccountName: pullthrough
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pullthrough
          image: ghcr.io/blechschmidt/pullthrough-security:latest
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/pullthrough/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: pullthrough-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/pullthrough
              readOnly: true
            - name: data
              mountPath: /var/lib/pullthrough
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: pullthrough-config
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: pullthrough-data
