# Plain-manifest deployment via kustomize:
#
#   kubectl apply -k deploy/k8s
#
# Pin the image to an immutable tag in your overlay instead of :latest:
#   images:
#     - name: ghcr.io/blechschmidt/pullthrough-security
#       newTag: 0.1.0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pullthrough

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.example.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/name: pullthrough
  app.kubernetes.io/part-of: pullthrough
