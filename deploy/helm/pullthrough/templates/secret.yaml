{{- if and (not .Values.secrets.existingSecret) .Values.secrets.data -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pullthrough.secretName" . }}
  labels:
    {{- include "pullthrough.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
