apiVersion: v1
kind: Service
metadata:
  name: {{ include "pullthrough.fullname" . }}
  labels:
    {{- include "pullthrough.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pullthrough.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.ssh.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pullthrough.fullname" . }}-ssh
  labels:
    {{- include "pullthrough.labels" . | nindent 4 }}
  {{- with .Values.ssh.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ssh.serviceType }}
  selector:
    {{- include "pullthrough.selectorLabels" . | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.ssh.port }}
      targetPort: ssh
      protocol: TCP
{{- end }}
