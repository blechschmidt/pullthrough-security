apiVersion: v1
kind: Pod
metadata:
  name: {{ include "pullthrough.fullname" . }}-test-connection
  labels:
    {{- include "pullthrough.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: readyz
      image: busybox:1.36
      command: ["wget"]
      args:
        - "--spider"
        - "-q"
        - "http://{{ include "pullthrough.fullname" . }}:{{ .Values.service.port }}/readyz"
